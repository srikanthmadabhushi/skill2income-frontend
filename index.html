<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skill2Income AI</title>

<style>
html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;

  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
}

.header {
  background: linear-gradient(90deg, #6366f1, #9333ea);
  color: white;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  background: linear-gradient(90deg, #6366f1, #9333ea);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.loading {
  text-align: center;
  margin-top: 10px;
}

.result-card {
  background: #f9fafb;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
  border: 1px solid #ddd;
}
</style>

</head>
<body>

<div class="container">
  <div class="header">
    <h2>🚀 Skill2Income AI</h2>
    <p>Turn your skills into income</p>
  </div>

  <input id="skills" placeholder="Enter your skills (e.g. Python)">
  <input id="interests" placeholder="Enter your interests (e.g. Freelancing)">
  <input id="time" placeholder="Time available (e.g. 2 hours)">

  <button onclick="generatePlan()">Generate Income Plan</button>

  <div id="loading" class="loading"></div>
  <div id="results"></div>
</div>

<script>
async function generatePlan() {
  const skills = document.getElementById("skills").value;
  const interests = document.getElementById("interests").value;
  const time = document.getElementById("time").value;

  const loading = document.getElementById("loading");
  const resultsDiv = document.getElementById("results");

  loading.innerHTML = "⏳ Generating...";
  resultsDiv.innerHTML = "";

  try {
    const response = await fetch("https://skill2income-api.onrender.com/generate-income-plan", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ skills, interests, time })
    });

    const data = await response.json();

    loading.innerHTML = "";

    if (data.result) {
      data.result.forEach(item => {
        const card = `
          <div class="result-card">
            <h3>${item.title}</h3>
            <p>${item.description}</p>
            <ul>
              ${item.steps.map(step => `<li>${step}</li>`).join("")}
            </ul>
            <b>💰 ${item.earnings}</b><br>
            <small>Monthly: ${item.monthly_estimate}</small>
          </div>
        `;
        resultsDiv.innerHTML += card;
      });
    } else {
      resultsDiv.innerHTML = "❌ Error generating results";
    }

  } catch (error) {
    loading.innerHTML = "";
    resultsDiv.innerHTML = "❌ Failed to connect to API";
  }
}
</script>

</body>
</html>
