<!DOCTYPE html>
<html>
<head>
  <title>Skill2Income AI</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
    }

    .card {
      backdrop-filter: blur(12px);
      background: rgba(255,255,255,0.15);
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 20px;
    }

    .header {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      color: white;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      outline: none;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: linear-gradient(90deg, #6a5acd, #8a2be2);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .result-card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .icon {
      font-size: 20px;
      margin-right: 8px;
    }

    ul {
      padding-left: 20px;
    }

    .earnings {
      margin-top: 10px;
      font-weight: bold;
      color: green;
    }

    .save-btn {
      margin-top: 10px;
      background: #28a745;
    }

    .spinner {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }

    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #6a5acd;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

  </style>
</head>

<body>

<div class="container">

  <!-- FORM -->
  <div class="card">
    <div class="header">🚀 Skill2Income AI</div>

    <input id="skills" placeholder="Enter skills (Python, Java)">
    <input id="interests" placeholder="Enter interests (Freelancing)">
    <input id="time" placeholder="Time available (2 hours)">

    <button onclick="generateIncomePlan()">Generate Income Plan</button>
  </div>

  <!-- RESULTS -->
  <div id="results"></div>

</div>

<script>

function getIcon(title) {
  if (title.toLowerCase().includes("freelance")) return "💻";
  if (title.toLowerCase().includes("tutor")) return "📘";
  if (title.toLowerCase().includes("automation")) return "⚙️";
  return "🚀";
}

async function generateIncomePlan() {

  const skills = document.getElementById("skills").value;
  const interests = document.getElementById("interests").value;
  const time = document.getElementById("time").value;

  const resultsDiv = document.getElementById("results");

  // 🔄 LOADING ANIMATION
  resultsDiv.innerHTML = `
    <div class="spinner">
      <div class="loader"></div>
    </div>
  `;

  try {
    const response = await fetch("https://skill2income-api.onrender.com/generate-income-plan", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ skills, interests, time })
    });

    const data = await response.json();

    resultsDiv.innerHTML = "";

    data.result.forEach(item => {

      const icon = getIcon(item.title);

      const card = document.createElement("div");
      card.className = "result-card";

      card.innerHTML = `
        <div class="title">
          <span class="icon">${icon}</span>${item.title}
        </div>

        <p>${item.description}</p>

        <ul>
          ${item.steps.map(step => `<li>${step}</li>`).join("")}
        </ul>

        <div class="earnings">💰 ${item.earnings}</div>

        <button class="save-btn" onclick='savePlan(${JSON.stringify(item)})'>
          Save Plan
        </button>
      `;

      resultsDiv.appendChild(card);
    });

  } catch (error) {
    resultsDiv.innerHTML = "<p style='color:red;'>❌ Failed to connect</p>";
  }
}

function savePlan(plan) {
  let saved = JSON.parse(localStorage.getItem("plans") || "[]");
  saved.push(plan);
  localStorage.setItem("plans", JSON.stringify(saved));
  alert("✅ Plan saved!");
}

</script>

</body>
</html>
