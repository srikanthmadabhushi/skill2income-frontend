<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skill2Income AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #e0e7ff);
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .header {
      text-align: center;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      color: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .card {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f9fafb;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .card h3 {
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="header">
    🚀 <h2>Skill2Income AI</h2>
    <p>Turn your skills into income</p>
  </div>

  <input id="skills" placeholder="Skills (e.g. Python)">
  <input id="interests" placeholder="Interests (e.g. Freelancing)">
  <input id="time" placeholder="Time Available (e.g. 2 hours/day)">

  <button onclick="generatePlan()">Generate Income Plan</button>

  <div id="results"></div>
</div>

<script>
  async function generatePlan() {
    const skills = document.getElementById("skills").value;
    const interests = document.getElementById("interests").value;
    const time = document.getElementById("time").value;

    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "⏳ Generating...";

    try {
      const response = await fetch("https://skill2income-api.onrender.com/generate-income-plan", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          skills: skills,
          interests: interests,
          time: time
        })
      });

      const data = await response.json();

      if (data.error) {
        resultsDiv.innerHTML = "❌ Error: " + data.error;
        return;
      }

      let html = "";

      data.result.forEach(item => {
        html += `
          <div class="card">
            <h3>💡 ${item.title}</h3>
            <p>${item.description}</p>
            <ul>
              ${item.steps.map(step => `<li>${step}</li>`).join("")}
            </ul>
            <p><b>💰 Earnings:</b> ${item.earnings}</p>
            <p><b>📊 Monthly:</b> ${item.monthly_estimate}</p>
          </div>
        `;
      });

      resultsDiv.innerHTML = html;

    } catch (error) {
      resultsDiv.innerHTML = "❌ Failed to connect to API";
    }
  }
</script>

</body>
</html>
