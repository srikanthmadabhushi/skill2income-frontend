<!DOCTYPE html>
<html>
<head>
  <title>Skill2Income AI</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      background: linear-gradient(90deg, #6a5acd, #8a2be2);
      color: white;
      padding: 15px;
      border-radius: 10px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #6a5acd, #8a2be2);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .result-card {
      background: white;
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    ul {
      padding-left: 20px;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>🚀 Skill2Income AI</h1>

    <input id="skills" placeholder="Enter your skills (e.g. Python)">
    <input id="interests" placeholder="Enter your interests (e.g. Freelancing)">
    <input id="time" placeholder="Time available (e.g. 2 hours)">

    <button onclick="generateIncomePlan()">Generate Income Plan</button>
  </div>

  <!-- RESULTS SHOW HERE -->
  <div id="results"></div>

</div>

<script>
async function generateIncomePlan() {

  const skills = document.getElementById("skills").value;
  const interests = document.getElementById("interests").value;
  const time = document.getElementById("time").value;

  const resultsDiv = document.getElementById("results");

  // 🔄 Loading state
  resultsDiv.innerHTML = "<p>⏳ Generating ideas...</p>";

  try {
    const response = await fetch("https://skill2income-api.onrender.com/generate-income-plan", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ skills, interests, time })
    });

    const data = await response.json();

    resultsDiv.innerHTML = "";

    if (data.error) {
      resultsDiv.innerHTML = "<p style='color:red;'>❌ API Error</p>";
      return;
    }

    data.result.forEach(item => {

      const card = document.createElement("div");
      card.className = "result-card";

      card.innerHTML = `
        <h3>${item.title}</h3>
        <p>${item.description}</p>
        <ul>
          ${item.steps.map(step => `<li>${step}</li>`).join("")}
        </ul>
        <p><strong>${item.earnings}</strong></p>
      `;

      resultsDiv.appendChild(card);
    });

  } catch (error) {
    resultsDiv.innerHTML = "<p style='color:red;'>❌ Failed to connect to API</p>";
  }
}
</script>

</body>
</html>
