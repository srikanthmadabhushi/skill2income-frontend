<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skill2Income AI</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #6a5acd;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #6a5acd, #8a2be2);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>🚀 Skill2Income AI</h2>

  <input id="skills" placeholder="Skills (e.g. Python)">
  <input id="interests" placeholder="Interests (e.g. Freelancing)">
  <input id="time" placeholder="Time (e.g. 2 hours)">

  <button onclick="generatePlan()">Generate Income Plan</button>

  <div id="result"></div>
</div>

<script>
async function generatePlan() {

  const skills = document.getElementById("skills").value;
  const interests = document.getElementById("interests").value;
  const time = document.getElementById("time").value;

  document.getElementById("result").innerHTML = "⏳ Loading...";

  try {
    const response = await fetch("https://skill2income-api.onrender.com/generate-income-plan", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        skills: skills,
        interests: interests,
        time: time
      })
    });

    const data = await response.json();

    if (data.error) {
      document.getElementById("result").innerHTML = "❌ " + data.error;
      return;
    }

    let html = "";

    data.result.forEach(item => {
      html += `
        <div style="margin-top:15px;padding:10px;border:1px solid #ddd;border-radius:8px;">
          <h3>${item.title}</h3>
          <p>${item.description}</p>
          <ul>
            ${item.steps.map(step => `<li>${step}</li>`).join("")}
          </ul>
          <p><b>💰 ${item.earnings}</b></p>
        </div>
      `;
    });

    document.getElementById("result").innerHTML = html;

  } catch (err) {
    console.error(err);
    document.getElementById("result").innerHTML = "❌ Failed to connect to API";
  }
}
</script>

</body>
</html>
